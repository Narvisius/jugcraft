plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"jugcraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

test {
	// src/test holds only compile-time guards (VanillaReferences); the real tests are the game
	// tests below. Gradle 9 fails a test task that discovers none.
	failOnNoDiscoveredTests = false
}

// In-game tests (src/gametest): a headless server runs them as part of `./gradlew build`.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "jugcraft-test"
		enableGameTests = true
		enableClientGameTests = true // Real client with rendering; CI job "client" runs it and keeps the screenshots.
		eula = true // Accepts the Minecraft EULA for the test server only.
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
