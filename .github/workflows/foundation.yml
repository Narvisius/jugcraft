name: Foundation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jugcraft-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check contribution foundation
        run: python3 scripts/check_repository.py
      - name: Check dependency pins and installer contracts
        run: |
          python3 scripts/package_modrinth.py check
          python3 -m unittest discover -s scripts/tests -v
